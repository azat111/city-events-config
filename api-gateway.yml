spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
      routes:
        - id: auth
          uri: lb://auth-service
          predicates:
            - Path=/api/auth/**
        - id: events
          uri: lb://event-service
          predicates:
            - Path=/api/events/**
server:
  port: 8080
